<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oscar Delivery Live</title>
<link rel="icon" type="image/png" href="logo.png">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#ffffff;--ink:#0b2a5b;--mut:#4a5a78;--card:#fbf8f0;--line:#e3d9bd;--g:#0b2a5b;--o:#c8932e;--on:#ffffff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS",Verdana,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font:800 26px/1.1 Georgia,serif;margin:8px 0 12px}h2{font:700 18px Georgia,serif;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.btn{display:inline-block;border:0;border-radius:8px;background:var(--g);color:var(--on);font:700 15px inherit;padding:10px 13px;margin:8px 6px 0 0;cursor:pointer;text-decoration:none}
.btn.o{background:var(--o);color:#0b2a5b}.btn.l{background:none;color:var(--ink);border:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--line)}
.err{color:#b3261e;font-weight:700}
.brand{text-align:center;margin:4px 0 6px}.brand img{width:150px;height:150px;display:block;margin:0 auto}
.brand h1{margin:4px 0 0;color:var(--ink)}small,p{color:var(--mut)}p{margin:3px 0;font-size:14px}
iframe{width:100%;height:260px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.ph{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.ph figure{margin:0}.ph img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}.ph img.big{width:100%;height:auto}.ph figcaption{font-size:12px;color:var(--mut)}
.btn[disabled]{opacity:.6}
.acts{display:flex;flex-wrap:wrap;align-items:flex-start}.cm{position:relative;display:block}.cm summary{list-style:none;display:inline-block}.cm summary::-webkit-details-marker{display:none}
.cmenu{position:absolute;top:100%;left:0;z-index:20;box-shadow:0 6px 18px rgba(11,42,91,.2);display:flex;flex-direction:column;gap:6px;margin:4px 0 0;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px;min-width:230px}
.cmenu a{padding:11px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600;background:var(--card)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

<script>
/* STEP 1: paste your Firebase settings here (see setup steps) */
const CFG={apiKey:"AIzaSyBj0k6GNxYDMULVkwSuf9UsoPP7rGeDZlg",authDomain:"oscar-delivery-19b7c.firebaseapp.com",projectId:"oscar-delivery-19b7c",appId:"1:593226523351:web:79b397324bbd379ce60692"};
/* STEP 2: the owner login email (lowercase). Must match the owner email in the rules. */
const OWNER="prorollgardner9@gmail.com";

const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if(CFG.apiKey.indexOf("PASTE")===0){app.innerHTML='<div class="card"><h2>Setup needed</h2><p>Paste your Firebase settings at the top of this file, then upload it again.</p></div>';throw new Error("setup")}
firebase.initializeApp(CFG);const auth=firebase.auth(),db=firebase.firestore();
let user=null,unsubs=[],riders=[],jobs=[],me=null,watch=null,lastSend=0,mapR="";
const LBL={new:"New",assigned:"Assigned",pickedup:"On the way",delivered:"Delivered"};
const NEXT={new:"assigned",assigned:"pickedup",pickedup:"delivered"};
const ago=t=>{if(!t)return"never";const m=Math.round((Date.now()-t)/60000);return m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" h ago"};
const nav=j=>!j.loc?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((j.addr||"")+", Liberia"):/^https?:/i.test(j.loc)?j.loc:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(j.loc);

auth.onAuthStateChanged(u=>{unsubs.forEach(f=>f());unsubs=[];stopShare();me=null;riders=[];jobs=[];user=u;
 if(!u)return loginView();
 (u.email||"").toLowerCase()===OWNER?ownerStart():riderStart()});

function loginView(){
 app.innerHTML=`<div class="card"><h2>Log in</h2><label for="em">Email</label><input id="em" type="email" autocomplete="email">
 <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
 <button class="btn" id="li">Log in</button><hr><b>New rider?</b>
 <label for="nm">Your name</label><input id="nm" autocomplete="name"><label for="ph">Phone / WhatsApp</label><input id="ph" type="tel">
 <button class="btn o" id="su">Create rider account</button><p id="err" class="err"></p></div>`;
 const err=m=>$("#err").textContent=m;
 $("#li").onclick=()=>auth.signInWithEmailAndPassword($("#em").value.trim(),$("#pw").value).catch(e=>err(e.message));
 $("#su").onclick=async()=>{const em=$("#em").value.trim(),pw=$("#pw").value,nm=$("#nm").value.trim(),ph=$("#ph").value.trim();
  if(!nm||!ph){err("Enter your name and phone first.");return}
  try{const c=await auth.createUserWithEmailAndPassword(em,pw);
   if(em.toLowerCase()!==OWNER)await db.collection("riders").doc(c.user.uid).set({name:nm,phone:ph,approved:false,ts:Date.now()})}catch(e){err(e.message)}};
}

/* ---------- OWNER ---------- */
function ownerStart(){
 app.innerHTML=`<div class="top"><span>Shop: ${esc(user.email)}</span><button class="btn l" id="lo" style="margin:0">Log out</button></div>
 <div class="card"><h2>New delivery</h2><label for="n">Customer name</label><input id="n"><label for="p">Customer phone</label><input id="p" type="tel">
 <label for="a">Address and landmark</label><textarea id="a"></textarea><label for="l">Map link or coordinates (optional)</label><input id="l">
 <label for="i">Items</label><textarea id="i"></textarea><label for="f">Delivery fee (USD, shop pays rider, buyer repays later)</label><input id="f" type="number" step="0.5" min="0" value="2">
 <button class="btn o" id="add">Create delivery</button><p id="msg" class="err"></p></div>
 <div id="map"></div><div id="rl"></div><div id="jl"></div>`;
 $("#lo").onclick=()=>auth.signOut();
 $("#add").onclick=()=>{const j={name:$("#n").value.trim(),phone:$("#p").value.trim(),addr:$("#a").value.trim(),loc:$("#l").value.trim(),items:$("#i").value.trim(),fee:Math.max(0,+$("#f").value||0),st:"new",rider:"",riderName:"",ts:Date.now()};
  if(!j.name||!j.phone||!j.addr||!j.items){$("#msg").textContent="Fill in name, phone, address and items.";return}
  db.collection("jobs").add(j).then(()=>{$("#msg").textContent="";["n","p","a","l","i"].forEach(k=>$("#"+k).value="")}).catch(e=>$("#msg").textContent=e.message)};
 unsubs.push(db.collection("riders").onSnapshot(s=>{riders=s.docs.map(d=>({id:d.id,...d.data()}));ownerLists()},e=>{$("#rl").textContent=e.message}));
 unsubs.push(db.collection("jobs").orderBy("ts","desc").onSnapshot(s=>{jobs=s.docs.map(d=>({id:d.id,...d.data()}));ownerLists()},e=>{$("#jl").textContent=e.message}));
}
/* a job counts toward pay once the rider has picked it up */
const payable=j=>j.rider&&(j.st==="pickedup"||j.st==="delivered");
const owed=id=>{const d=jobs.filter(j=>j.rider===id&&payable(j)),u=d.filter(j=>!j.paid),sum=a=>a.reduce((t,j)=>t+(Number(j.fee)||0),0);
 return d.length?`<small>${d.length} job${d.length>1?"s":""} · you owe <b>$${sum(u).toFixed(2)}</b> (${u.length} unpaid) · paid $${sum(d.filter(j=>j.paid)).toFixed(2)}</small><br>`:""};
function ownerLists(){
 const ok=riders.filter(r=>r.approved);
 $("#rl").innerHTML=`<div class="card"><h2>Riders</h2>`+(riders.map(r=>`<div style="margin:8px 0"><b>${esc(r.name)}</b> · ${esc(r.phone)}<br>${owed(r.id)}
  ${r.approved?`<span class="tag">Approved</span> <small>seen ${ago(r.ts&&r.lat?r.ts:0)}</small>`:`<button class="btn" data-ap="${r.id}">Approve</button>`}
  ${r.lat?`<button class="btn l" data-sh="${r.id}">Show on map</button>`:""}</div>`).join("")||"<p>No riders yet. Riders create their own account from the login page.</p>")+`</div>`;
 const r=riders.find(x=>x.id===mapR);
 $("#map").innerHTML=r&&r.lat?`<iframe title="Rider map" src="https://www.openstreetmap.org/export/embed.html?bbox=${r.lng-.01},${r.lat-.01},${r.lng+.01},${r.lat+.01}&layer=mapnik&marker=${r.lat},${r.lng}"></iframe><p>${esc(r.name)} · updated ${ago(r.ts)} · <a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" rel="noopener">Open in Google Maps</a></p>`:"";
 $("#jl").innerHTML=jobs.map(j=>`<div class="card"><span class="tag">${LBL[j.st]||j.st}</span> <h2>${esc(j.name)} · ${esc(j.phone)}</h2>
  <p>${esc(j.addr)}</p><p>${esc(j.items)}</p>${photos(j)}<p>Delivery fee <b>$${Number(j.fee).toFixed(2)}</b> ${j.paid?`<span class="tag">Rider paid</span>`:payable(j)?`<span class="tag" style="background:#c8932e;color:#0b2a5b">Rider not paid</span>`:""}</p>
  <select data-as="${j.id}" aria-label="Assign rider"><option value="">Assign rider…</option>${ok.map(x=>`<option value="${x.id}"${x.id===j.rider?" selected":""}>${esc(x.name)}</option>`).join("")}</select>
  <div class="acts">${j.st!=="delivered"&&NEXT[j.st]?`<button class="btn o" data-adv="${j.id}">Mark ${LBL[NEXT[j.st]].toLowerCase()}</button>`:""}
  ${payable(j)?`<button class="btn ${j.paid?"l":"o"}" data-pay="${j.id}">${j.paid?"Undo paid":"Mark rider paid"}</button>`:""}${j.paid?"":`<button class="btn l" data-fee="${j.id}">Change fee</button>`}
  ${cm("o"+j.id,[["Call customer",tel(j.phone)],["WhatsApp customer",wa(j.phone),1],...(()=>{const r=riders.find(x=>x.id===j.rider);return r?[["Call rider "+esc(r.name),tel(r.phone)],["WhatsApp rider",wa(r.phone),1]]:[]})()])}
  <a class="btn l" href="${esc(nav(j))}" target="_blank" rel="noopener">Map</a><button class="btn l" data-rm="${j.id}">Remove</button></div></div>`).join("")||`<div class="card"><p>No deliveries yet.</p></div>`;
}

/* ---------- RIDER ---------- */
function riderStart(){
 app.innerHTML=`<div class="top"><span>Rider login</span><button class="btn l" id="lo" style="margin:0">Log out</button></div><div id="rb"></div>`;
 $("#lo").onclick=()=>auth.signOut();
 unsubs.push(db.collection("riders").doc(user.uid).onSnapshot(d=>{me=d.exists?d.data():null;riderRender()},e=>{$("#rb").textContent=e.message}));
 unsubs.push(db.collection("jobs").where("rider","==",user.uid).onSnapshot(s=>{jobs=s.docs.map(d=>({id:d.id,...d.data()}));riderRender()},()=>{}));
}
function riderRender(){
 const b=$("#rb");if(!b)return;
 if(!me){b.innerHTML=`<div class="card"><p>Setting up your account…</p></div>`;return}
 if(!me.approved){b.innerHTML=`<div class="card"><h2>Hello ${esc(me.name)}</h2><p>Waiting for the shop to approve your account. Check back soon.</p></div>`;return}
 const open=jobs.filter(j=>j.st!=="delivered").sort((a,c)=>a.ts-c.ts);
 b.innerHTML=`<div class="card"><h2>Hello ${esc(me.name)}</h2><button class="btn ${watch!=null?"o":""}" id="sh">${watch!=null?"Stop sharing location":"Share my live location"}</button>
 <p>Keep this page open and the screen on while delivering. The shop sees your position update every 15 seconds.</p></div>`+
 (open.map(j=>`<div class="card"><span class="tag">${LBL[j.st]||j.st}</span><h2>${esc(j.name)}</h2><p>${esc(j.addr)}</p><p>${esc(j.items)}</p>${photos(j)}
  <div class="acts">${cm("r"+j.id,[["Call customer",tel(j.phone)],["WhatsApp customer",wa(j.phone),1],...SHOP.map(n=>["Call shop "+n,tel(n)]),["WhatsApp shop",wa(SHOP[0]),1]])}<a class="btn l" href="${esc(nav(j))}" target="_blank" rel="noopener">Navigate</a>
  ${NEXT[j.st]&&j.st!=="new"?`<button class="btn o" data-snap="${j.id}">${j.st==="assigned"?"I picked it up (take photo)":"Delivered (take photo)"}</button>`:""}</div></div>`).join("")||`<div class="card"><p>No open deliveries for you.</p></div>`);
 $("#sh").onclick=()=>{watch!=null?stopShare():startShare();riderRender()};
}
function startShare(){
 if(!navigator.geolocation){alert("Location is not available on this device.");return}
 watch=navigator.geolocation.watchPosition(p=>{if(Date.now()-lastSend<15000)return;lastSend=Date.now();
  db.collection("riders").doc(user.uid).update({lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now()})},
  ()=>{alert("Allow location access for this page, then try again.");stopShare();riderRender()},{enableHighAccuracy:true,maximumAge:5000});
}
function stopShare(){if(watch!=null&&navigator.geolocation)navigator.geolocation.clearWatch(watch);watch=null}



/* ---------- call menu ---------- */
const SHOP=["+231880958212","+231770368215"];
const digits=n=>{let d=String(n||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("0"))d="231"+d.slice(1);return d};
let openCM=null;
const cm=(id,items)=>`<details class="cm" data-cm="${id}"${openCM===id?" open":""}><summary class="btn">Call / Chat &#9662;</summary><div class="cmenu">${items.filter(i=>i[1]).map(i=>`<a href="${esc(i[1])}"${i[2]?' target="_blank" rel="noopener"':""}>${i[0]}</a>`).join("")}</div></details>`;
const tel=n=>digits(n)?"tel:+"+digits(n):"",wa=n=>digits(n)?"https://wa.me/"+digits(n):"";
document.addEventListener("toggle",e=>{const t=e.target;if(t.dataset&&t.dataset.cm){if(t.open)openCM=t.dataset.cm;else if(openCM===t.dataset.cm)openCM=null}},true);

/* ---------- photos ---------- */
const photos=j=>(j.riderPic||j.receiverPic)?`<div class="ph">${j.riderPic?`<figure><img data-big="1" alt="Rider photo" src="${j.riderPic}"><figcaption>Rider at pickup</figcaption></figure>`:""}${j.receiverPic?`<figure><img data-big="1" alt="Receiver photo" src="${j.receiverPic}"><figcaption>Receiver</figcaption></figure>`:""}</div>`:"";
function shrink(file,max=640,q=.6){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",q))};
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("Could not read the photo"))};im.src=u})}
function snap(id,btn){
 const j=jobs.find(x=>x.id===id);if(!j||!NEXT[j.st])return;
 const pick=j.st==="assigned",inp=document.createElement("input");
 inp.type="file";inp.accept="image/*";inp.capture=pick?"user":"environment";inp.style.display="none";document.body.appendChild(inp);
 inp.onchange=async()=>{const f=inp.files&&inp.files[0];inp.remove();if(!f)return;
  btn.disabled=true;btn.textContent="Saving photo...";
  try{const img=await shrink(f);
   await db.collection("jobs").doc(id).update(pick?{st:"pickedup",riderPic:img,pickTs:Date.now()}:{st:"delivered",receiverPic:img,doneTs:Date.now()})}
  catch(e){alert("Photo not saved: "+e.message);btn.disabled=false;riderRender()}};
 inp.click();
}

/* ---------- shared clicks ---------- */
document.addEventListener("click",e=>{const t=e.target,d=t.dataset||{};
 if(d.snap)snap(d.snap,t);
 if(t.dataset&&t.dataset.big)t.classList.toggle("big");
 if(d.ap)db.collection("riders").doc(d.ap).update({approved:true});
 if(d.sh){mapR=d.sh;ownerLists()}
 if(d.adv){const j=jobs.find(x=>x.id===d.adv);if(j&&NEXT[j.st])db.collection("jobs").doc(j.id).update({st:NEXT[j.st]})}
 if(d.pay){const j=jobs.find(x=>x.id===d.pay);if(j&&(j.paid||confirm("Mark paid: $"+Number(j.fee).toFixed(2)+" to "+(j.riderName||"rider")+"? Do this after you send the money.")))db.collection("jobs").doc(j.id).update(j.paid?{paid:false,paidTs:null}:{paid:true,paidTs:Date.now()})}
 if(d.fee){const j=jobs.find(x=>x.id===d.fee),v=j&&prompt("Delivery fee (USD) for "+j.name,j.fee);if(v!==null&&v!==false&&j&&!isNaN(+v)&&v!=="")db.collection("jobs").doc(j.id).update({fee:Math.max(0,+v)})}
 if(d.rm&&confirm("Remove this delivery?"))db.collection("jobs").doc(d.rm).delete();
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset&&t.dataset.as){const r=riders.find(x=>x.id===t.value),j=jobs.find(x=>x.id===t.dataset.as);
  db.collection("jobs").doc(t.dataset.as).update({rider:t.value,riderName:r?r.name:"",st:t.value?(j&&j.st==="new"?"assigned":j.st):"new"})}
});
setInterval(()=>{if(user&&$("#rl"))ownerLists()},60000);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
